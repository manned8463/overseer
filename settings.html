<div class="overseer-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="{{title}}">{{title}}</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label for="overseer_enabled">
                <span data-i18n="Enabled">Enabled</span>
            </label>
            <input id="overseer_enabled" type="checkbox" {{#if isEnabled}}checked{{/if}} />
            <label for="overseer_option1">
                <span data-i18n="Option">Option</span>
            </label>
            <input id="overseer_option1" type="text" value="{{defaultValue}}" />
        </div>
    </div>
</div>
